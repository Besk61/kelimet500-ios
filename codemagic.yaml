workflows:
  kelimet500-ios:
    name: Kelimet500 iOS (TestFlight IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: kelimet500_appstore

    environment:
      ios_signing:
        provisioning_profiles:
          - kelimet500_bora_appstore_profile
        certificates:
          - kelimet500_bora_distribution

      vars:
        BUNDLE_ID: "com.beskentertainment.kelimet500"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"

        VITE_PUBLIC_APP_URL: "https://kelimet500.boraeskicioglu.com/"

        # Gerçek AdMob iOS uygulama ve banner kimliklerin.
        ADMOB_IOS_APP_ID: "ca-app-pub-5362304445784648~6225471849"
        VITE_ADMOB_IOS_BANNER_ID: "ca-app-pub-5362304445784648/4912390176"

        # TestFlight sırasında Google test bannerı gösterir.
        # App Store production build'inde bunu "false" yapacağız.
        VITE_ADMOB_TEST_MODE: "true"

        # Bora Eskicioğlu Apple Developer Team ID
        APPLE_TEAM_ID: "756W85DD2V"

      node: 22
      xcode: 26.6

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Verify iOS environment
        script: |
          npm run verify:ios

      - name: Create and sync Capacitor iOS project
        script: |
          npm run mobile:ios

      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # IPA App Store Connect'e yüklenir ve processing tamamlanınca
        # TestFlight Builds altında görünür. İlk build'de otomatik beta
        # review'a göndermiyoruz; internal test dağıtımını panelden açarız.
        submit_to_app_store: false
